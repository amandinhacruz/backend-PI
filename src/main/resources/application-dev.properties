# Desenvolvimento local: PostgreSQL na propria maquina.
# Para outro banco (ex.: a simulacao), defina SPRING_DATASOURCE_URL na configuracao de execucao.
spring.jpa.hibernate.ddl-auto=update

spring.datasource.url=jdbc:postgresql://localhost:5432/projeto_pi
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# Aceita o front em qualquer porta local (o Vite usa 5174, 5175... quando a 5173 esta ocupada).
vertice.cors.padroes-locais=http://localhost:*,http://127.0.0.1:*
