spring.application.name=Projeto-PI

# Perfil padrao: dev (PostgreSQL local). No deploy o Dockerfile define SPRING_PROFILES_ACTIVE=prod,
# que le o banco das variaveis POSTGRES* do servidor de hospedagem.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=22MB

# --- Analista generativo do matchmaking (Claude). Detalhes em docs/IA.md ---
# Desligado por padrao: a clausula 5.4 da Politica de Privacidade exige atualizar o contrato antes.
# A chave NAO fica neste arquivo: defina a variavel de ambiente ANTHROPIC_API_KEY.
vertice.ia.habilitada=${VERTICE_IA_HABILITADA:false}
vertice.ia.modelo=${VERTICE_IA_MODELO:claude-opus-5-5}
vertice.ia.esforco=${VERTICE_IA_ESFORCO:medium}
# So perfis de usuarios que aceitaram esta versao (ou posterior) da Politica vao para a IA.
vertice.ia.politica-minima=${VERTICE_IA_POLITICA_MINIMA:1.1}
vertice.ia.assincrono=${VERTICE_IA_ASSINCRONO:true}
vertice.ia.lote=6
vertice.ia.max-por-consulta=18
vertice.ia.timeout-segundos=120
